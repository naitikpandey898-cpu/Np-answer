<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NP Answer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1d29;--muted:#6b7084;--accent:#5b4bdb;--accent-t:#fff;--user:#e9e6ff;--border:#e3e5ee;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14151c;--card:#1e2029;--text:#eceef7;--muted:#9aa0b8;--accent:#8b7dff;--accent-t:#14151c;--user:#2b2858;--border:#2d3040;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0}
h1 span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.tools{font-size:12px;color:var(--muted)}
.tools label{display:flex;align-items:center;gap:5px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--border)}
.u{align-self:flex-end;background:var(--user)}
.a{align-self:flex-start;background:var(--card)}
.a button{display:block;margin-top:6px;background:none;border:0;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 0}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.bar{display:flex;gap:8px;padding:10px 12px 12px;align-items:center}
#q{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
#q:focus{border-color:var(--accent)}
.btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-t);font-size:19px;cursor:pointer;flex:none}
.btn.on{background:#e5484d;color:#fff}
.btn:disabled{opacity:.5}
#status{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
</style>
</head>
<body>
<header>
  <div><h1>NP <span>Answer</span></h1><div class="sub">Kuch bhi poochho — likhkar ya bolkar</div></div>
  <div class="tools"><label><input type="checkbox" id="auto"> Bolkar jawab</label></div>
</header>
<div id="chat"></div>
<div id="status"></div>
<div class="bar">
  <button class="btn" id="mic" title="Bolkar poochho">🎤</button>
  <input id="q" type="text" placeholder="Apna sawal likhein…" autocomplete="off">
  <button class="btn" id="send" title="Bhejo">➤</button>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var chat=$('chat'),q=$('q'),send=$('send'),mic=$('mic'),st=$('status'),auto=$('auto');
var busy=false,rec=null;
function setStatus(t){st.textContent=t||''}

function empty(){
  chat.innerHTML='<div class="empty"><div style="font-size:42px">🤖</div><div>Namaste! Main <b>NP Answer</b> hoon.<br>🎤 dabakar bolo — main bolkar jawab dunga.<br>Main Wikipedia se jawab laata hoon, isliye kisi cheez ka naam likhkar poochho.</div><div class="chips" id="chips"></div></div>';
  ['भारत की राजधानी','Albert Einstein','अभी समय क्या है?','12 x 8'].forEach(function(t){
    var b=document.createElement('button');b.textContent=t;b.onclick=function(){ask(t,false)};$('chips').appendChild(b)});
}
empty();
function add(cls,t){
  var e=chat.querySelector('.empty');if(e)chat.innerHTML='';
  var m=document.createElement('div');m.className='msg '+cls;m.textContent=t;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;
}

function speak(text){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.replace(/\s+/g,' ').trim());
    var hi=/[\u0900-\u097F]/.test(text);
    u.lang=hi?'hi-IN':'en-IN';
    var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace('_','-').toLowerCase().indexOf(hi?'hi':'en')===0})[0];
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
try{speechSynthesis.getVoices()}catch(e){}

var STOP=('kya hai hain ho hota hoti hote kaun kab kahan kaise kyun kyu kitna kitni kitne ka ki ke ko se me mein par aur batao bataiye bataao btao mujhe hume tum aap tumhe bare baare ke liye abhi what is are was who when where how why the a an of in on to tell me about please define meaning full form '+
'क्या है हैं हो होता होती होते कौन कब कहाँ कहां कैसे क्यों कितना कितनी कितने का की के को से में मैं पर और बताओ बताइए बताइये मुझे हमें तुम आप तुम्हें बारे लिए अभी').split(' ');

function cleanQ(t){
  var w=t.toLowerCase().replace(/[?.,!।"]/g,' ').split(/\s+/).filter(function(x){return x&&STOP.indexOf(x)<0});
  return w.join(' ');
}

async function wiki(lang,query){
  var u='https://'+lang+'.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(query)+
    '&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*';
  var r=await fetch(u);var d=await r.json();
  var p=d&&d.query&&d.query.pages;if(!p)return null;
  var k=Object.keys(p)[0];var e=p[k];
  if(!e||!e.extract)return null;
  return {title:e.title,text:e.extract.trim(),lang:lang};
}

async function answer(text){
  var t=text.trim(),low=t.toLowerCase();
  // 1. Kisne banaya
  if(/(kisne|who (made|created|built|developed)|your (creator|developer|maker)|किसने|निर्माता|तुम्हें किसने|aapko kisne|tumhe kisne)/i.test(t)){
    return {text:'Mujhe Naitik Pandey ne banaya hai. Naitik BCA (Bachelor of Computer Application) pehle saal ka student hai aur Karma Devi Smriti Mahavidalay me padhta hai, session 2026/27. Wo C++ seekh raha hai aur kai websites bana chuka hai, jaise fee management website aur नैतिक म्यूजिक website. Uska YouTube channel bhi hai: नैतिक म्यूजिक.'};
  }
  // 2. Greeting
  if(/^(hi|hello|hey|namaste|नमस्ते|हेलो|हैलो|नमस्कार)\b/i.test(low)){
    return {text:'Namaste! Main NP Answer hoon. Kuch bhi poochho.'};
  }
  // 3. Date / time
  if(/(tarikh|tareekh|date|तारीख|तिथि|aaj kaun sa din|आज कौन सा दिन)/i.test(t)){
    return {text:'Aaj ki tarikh: '+new Date().toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
  }
  if(/(\btime\b|samay|waqt|समय|टाइम|वक्त|baje|बजे)/i.test(t)){
    return {text:'Abhi samay hai: '+new Date().toLocaleTimeString('hi-IN',{hour:'numeric',minute:'2-digit'})};
  }
  // 4. Maths
  var m=low.replace(/(kitna|kitne|hota|hai|hain|what|is|calculate|batao|bataiye|plus|minus|कितना|होता|है|क्या|=|\?)/g,function(x){return x==='plus'?'+':x==='minus'?'-':''}).replace(/[x×]/g,'*').replace(/÷/g,'/').trim();
  if(/^[\d+\-*\/().%\s]+$/.test(m)&&/\d\s*[+\-*\/%]\s*\d/.test(m)){
    try{var v=Function('"use strict";return ('+m+')')();if(isFinite(v))return {text:t.replace(/\?/g,'')+' = '+(Math.round(v*1e8)/1e8)}}catch(e){}
  }
  // 5. Wikipedia
  var query=cleanQ(t)||t;
  var dev=/[\u0900-\u097F]/.test(t);
  var order=dev?['hi','en']:['en','hi'];
  for(var i=0;i<order.length;i++){
    try{var res=await wiki(order[i],query);if(res)return {text:res.text,src:'Wikipedia: '+res.title}}catch(e){}
  }
  return {text:'Maaf kijiye, mujhe iska jawab nahi mila. Sawal chhota karke ya kisi cheez ka naam likhkar poochhiye (jaise "Taj Mahal" ya "photosynthesis").'};
}

async function ask(text,byVoice){
  text=(text||'').trim();if(!text||busy)return;
  try{speechSynthesis.cancel()}catch(e){}
  busy=true;send.disabled=true;q.value='';
  add('u',text);
  var m=add('a','…');setStatus('Dhoondh raha hoon…');
  try{
    var r=await answer(text);
    m.textContent=r.text;
    if(r.src){var s=document.createElement('div');s.className='src';s.textContent=r.src;m.appendChild(s)}
    var b=document.createElement('button');b.textContent='🔊 Sunao';b.onclick=function(){speak(r.text)};m.appendChild(b);
    if(byVoice||auto.checked)speak(r.text);
  }catch(err){
    m.textContent='Kuch gadbad ho gayi. Internet check karke dobara koshish karein.';
  }finally{busy=false;send.disabled=false;setStatus('');chat.scrollTop=chat.scrollHeight}
}

mic.onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStatus('Is browser me mic support nahi hai. Chrome use karein ya likhkar poochhein.');return}
  try{speechSynthesis.cancel();var z=new SpeechSynthesisUtterance(' ');z.volume=0;speechSynthesis.speak(z)}catch(e){}
  if(rec){try{rec.stop()}catch(e){}return}
  rec=new SR();rec.lang='hi-IN';rec.interimResults=true;rec.continuous=false;
  var txt='';
  rec.onstart=function(){mic.classList.add('on');setStatus('Sun raha hoon… boliye')};
  rec.onresult=function(e){txt='';for(var i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;q.value=txt};
  rec.onerror=function(e){setStatus(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mic ki permission nahi mili. Chrome me site ko Microphone allow karein.':'Awaaz sun nahi paya, dobara koshish karein.')};
  rec.onend=function(){mic.classList.remove('on');var t=txt.trim();rec=null;if(t){setStatus('');ask(t,true)}};
  try{rec.start()}catch(e){rec=null}
};
send.onclick=function(){ask(q.value,false)};
q.addEventListener('keydown',function(e){if(e.key==='Enter')ask(q.value,false)});
})();
</script>
</body>
</html>
